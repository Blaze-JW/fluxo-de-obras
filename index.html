<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fluxo de Obras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: top bar + tabbed workspace (Painel / Projetos); a side drawer holds one project's full record. */
:root {
  --bg: #f3f4f3;
  --surface: #ffffff;
  --surface-2: #eceeed;
  --line: #d8dcda;
  --fg: #1d2321;
  --muted: #5d6763;
  --accent: #1f5f5b;
  --accent-fg: #ffffff;
  --accent-soft: #dcebe9;
  --bad: #b3261e;
  --bad-soft: #f8e1df;
  --warn: #8a5a00;
  --warn-soft: #f8ecd2;
  --ok: #2c6e3a;
  --ok-soft: #e0f0e2;
  --shadow: 0 8px 30px rgba(20, 30, 28, .16);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141917; --surface: #1c2220; --surface-2: #232b28; --line: #33403b;
    --fg: #e6ebe9; --muted: #9aa7a2; --accent: #6fbfb6; --accent-fg: #0c1614; --accent-soft: #1f3633;
    --bad: #f2a29b; --bad-soft: #3b1f1d; --warn: #e8c071; --warn-soft: #3a2f17; --ok: #8fd29c; --ok-soft: #1d3322;
    --shadow: 0 8px 30px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1c2220; --surface-2: #232b28; --line: #33403b;
  --fg: #e6ebe9; --muted: #9aa7a2; --accent: #6fbfb6; --accent-fg: #0c1614; --accent-soft: #1f3633;
  --bad: #f2a29b; --bad-soft: #3b1f1d; --warn: #e8c071; --warn-soft: #3a2f17; --ok: #8fd29c; --ok-soft: #1d3322;
  --shadow: 0 8px 30px rgba(0,0,0,.5); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: .85em; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand .mark { width: 28px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, var(--accent) 0 50%, var(--surface-2) 50%); border: 1px solid var(--line); }
.brand h1 { font-size: 18px; letter-spacing: .01em; }
.brand small { display: block; color: var(--muted); font-size: 12px; font-family: var(--f-body); font-weight: 400; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 8px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 7px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }

main { padding-block: 20px 60px; display: grid; gap: 24px; }
main > *, .two > * { min-width: 0; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.section-head h2 { font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; text-align: left; display: grid; gap: 2px; }
.kpi b { font-family: var(--f-display); font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi span { color: var(--muted); font-size: 13px; }
.kpi.bad b { color: var(--bad); } .kpi.warn b { color: var(--warn); }
.kpi[data-filter] { cursor: pointer; }
.kpi[data-filter]:hover { border-color: var(--muted); }
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Attention list */
.two { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.row .sev { align-self: stretch; }
.row .sev.bad { background: var(--bad); } .row .sev.warn { background: var(--warn); } .row .sev.info { background: var(--accent); }
.row .t { font-weight: 600; }
.row .d { color: var(--muted); font-size: 13px; }
.row .when { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
.empty { padding: 22px 16px; color: var(--muted); text-align: center; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }

/* Pipeline */
.pipe-scroll { overflow-x: auto; padding-bottom: 6px; }
.pipe { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: 10px; }
.col { background: var(--surface-2); border-radius: 10px; padding: 8px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.col h3 { font-size: 14px; display: flex; justify-content: space-between; padding: 4px 4px 2px; }
.col h3 span { color: var(--muted); font-variant-numeric: tabular-nums; }
.col p.hint { margin: 0 4px 4px; font-size: 12px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; text-align: left; display: grid; gap: 5px; width: 100%; }
.card:hover { border-color: var(--muted); }
.card .ref { color: var(--muted); }
.card .name { font-weight: 600; line-height: 1.25; }
.card .piece { font-size: 13px; color: var(--muted); }

/* Agenda */
.agenda .row { grid-template-columns: 64px minmax(0, 1fr); padding-left: 14px; }
.agenda .date { font-family: var(--f-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.agenda .date small { display: block; font-family: var(--f-body); color: var(--muted); font-weight: 400; font-size: 12px; text-transform: capitalize; }

/* Projects table */
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters input, .filters select { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 10px; }
.filters input { min-width: 0; flex: 1 1 220px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; min-width: 820px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--surface-2); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 14, .45); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg); z-index: 21; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.d-head { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start; }
.d-head .grow { flex: 1; min-width: 0; }
.d-head h2 { font-size: 20px; }
.d-head .sub { color: var(--muted); font-size: 14px; }
.d-body { overflow-y: auto; padding: 16px 18px 40px; display: grid; gap: 16px; align-content: start; }
.stepper { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.step { display: grid; gap: 4px; font-size: 12px; color: var(--muted); text-align: center; }
.step i { height: 6px; border-radius: 3px; background: var(--line); }
.step.done i { background: var(--accent); opacity: .5; }
.step.now i { background: var(--accent); }
.step.now { color: var(--fg); font-weight: 600; }
@media (max-width: 520px) { .step span { display: none; } .step.now span { display: block; white-space: nowrap; } .stepper { grid-template-columns: repeat(6, minmax(0,1fr)); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.panel h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel.gate.blocked { border-color: var(--bad); }
.panel.gate.ready { border-color: var(--ok); }
.gate-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.msg { width: 100%; min-height: 130px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface-2); resize: vertical; font-size: 14px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
@media (max-width: 560px) { .fields { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 3px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=tel], .field input[type=email], .field select, .field textarea { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--surface); width: 100%; min-width: 0; }
.field.missing input, .field.missing select { border-color: var(--bad); background: var(--bad-soft); }
.field.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; padding: 6px 0; }
.field.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.field.check label { color: var(--fg); font-size: 14px; }
.field.check.missing label { color: var(--bad); }
.field.full { grid-column: 1 / -1; }
.who { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 0 5px; border-radius: 4px; background: var(--surface-2); }
.stage-sec { opacity: 1; }
.stage-sec.future h3 { color: var(--muted); }
.hist { display: grid; gap: 6px; font-size: 14px; }
.hist div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; }
.hist time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.note-add { display: flex; gap: 8px; }
.note-add input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--surface); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--bad-soft); color: var(--bad); padding: 8px 10px; border-radius: 8px; }
/* Role switch + worker views */
.roles button { padding: 6px 12px; }
.head-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.role-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.role-head h2 { font-size: 22px; }
.role-head p { margin: 0; color: var(--muted); }
.jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 14px; }
.job { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.job.urgent { border-color: var(--bad); }
.job-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.job-head .name { font-family: var(--f-display); font-weight: 600; font-size: 17px; line-height: 1.2; }
.job-head .ref { color: var(--muted); }
.ficha { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; margin: 0; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.ficha div { min-width: 0; }
.ficha dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ficha dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.ficha .wide { grid-column: 1 / -1; }
.job-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.issue { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.report { display: grid; gap: 6px; }
.report textarea { border: 1px solid var(--line); border-radius: 7px; padding: 8px; min-height: 64px; background: var(--surface); resize: vertical; }
.inline-field { display: grid; gap: 3px; }
.inline-field label { font-size: 13px; color: var(--muted); }
.inline-field input { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--surface); width: 100%; }
.inline-field.missing input { border-color: var(--bad); background: var(--bad-soft); }
.checks { display: grid; gap: 4px; }
.checks label { display: flex; gap: 8px; align-items: center; font-weight: 600; padding: 6px 0; }
.checks input { width: 20px; height: 20px; accent-color: var(--accent); }
.day-head { font-family: var(--f-display); font-size: 15px; font-weight: 600; margin: 4px 0 8px; display: flex; gap: 8px; align-items: center; }
.contact { display: grid; gap: 4px; font-size: 14px; }
.contact a { color: var(--accent); font-weight: 600; }
.compact .row { grid-template-columns: minmax(0, 1fr) auto; padding-left: 14px; cursor: default; }
.compact .row:hover { background: none; }
.expand { padding: 0 14px 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.list .expand:last-child { border-bottom: 0; }
/* Customer page */
.client-wrap { max-width: 680px; margin: 0 auto; width: 100%; display: grid; gap: 16px; }
.preview-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); color: var(--fg); padding: 10px 12px; border-radius: 8px; font-size: 14px; }
.preview-bar select { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: var(--surface); min-width: 0; max-width: 100%; }
.client-hero { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 8px; }
.client-hero .hello { color: var(--muted); }
.client-hero h2 { font-size: 26px; }
.client-hero .next { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 16px; }
.timeline li::before { content: ""; position: absolute; left: 13px; top: 24px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline .dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); z-index: 1; }
.timeline li.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.timeline li.now .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.timeline b { display: block; }
.timeline span { color: var(--muted); font-size: 14px; }
.drop { position: relative; display: grid; gap: 2px; border: 2px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; color: var(--muted); font-size: 14px; }
.drop b { color: var(--fg); }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip .x { border: 0; background: none; padding: 0 0 0 4px; color: inherit; font: inherit; cursor: pointer; }
.field.found input, .field.found select { border-color: var(--ok); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); display: inline-block; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: rot .8s linear infinite; } @keyframes rot { to { transform: rotate(360deg); } } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 40; font-weight: 600; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>
<script src="demo.js"></script>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><div class="mark" aria-hidden="true"></div><h1>Fluxo de Obras<small id="role-sub">Gestão de projetos em pedra</small></h1></div>
    <nav class="tabs roles" aria-label="Vista">
      <button id="role-gestao" data-role="gestao" aria-pressed="true">Gestão</button>
      <button id="role-producao" data-role="producao" aria-pressed="false">Produção</button>
      <button id="role-montagem" data-role="montagem" aria-pressed="false">Montagem</button>
      <button id="role-cliente" data-role="cliente" aria-pressed="false">Cliente</button>
    </nav>
    <div class="head-tools" id="head-tools"></div>
  </div>
</header>
<main class="wrap" id="view"></main>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
(function () {
  "use strict";

  // ---------- Workflow definition ----------
  var STAGES = ["Orçamento", "Confirmação", "Medição", "Produção", "Montagem", "Concluído"];
  var STAGE_HINT = [
    "Recolher o pedido e enviar o orçamento",
    "Cliente aceita e marca-se a medição",
    "Medir em obra e fechar os detalhes técnicos",
    "Reservar a chapa, cortar e acabar",
    "Entregar e montar em obra",
    "Obra fechada"
  ];
  var CLIENT_TYPES = ["Cliente final", "Loja parceira", "Construtor"];
  var PIECES = ["Bancada de cozinha", "Revestimento de cozinha", "Revestimento de casa de banho", "Base de duche", "Mesa de jantar", "Outro"];
  var isKitchen = function (p) { return p.specs.pieceType === "Bancada de cozinha"; };
  var hasPartner = function (p) { return p.specs.clientType && p.specs.clientType !== "Cliente final"; };

  // stage = the stage that cannot be left until the field is filled; who = who has to provide it
  var FIELDS = [
    { key: "clientName", label: "Nome do cliente", type: "text", stage: 0, who: "equipa" },
    { key: "clientType", label: "Origem do pedido", type: "select", options: CLIENT_TYPES, stage: 0, who: "equipa" },
    { key: "partner", label: "Loja / construtor", type: "text", stage: 0, who: "equipa", when: hasPartner },
    { key: "phone", label: "Telefone", type: "tel", stage: 0, who: "cliente" },
    { key: "email", label: "Email", type: "email", stage: -1, who: "cliente" },
    { key: "pieceType", label: "Tipo de peça", type: "select", options: PIECES, stage: 0, who: "cliente" },
    { key: "stone", label: "Pedra / material", type: "text", stage: 0, who: "cliente", ph: "ex.: Granito Preto Zimbabwe" },

        ficha(p, TECH) +

      return '<div class="row"><span><span class="t">' + esc(p.specs.clientName || "") + '</span><br><span class="d">' + esc(p.specs.pieceType || "") + " · " + esc(p.specs.stone || "") + " · " + esc(p.specs.slab || "") + '</span></span><span class="job-actions">' + deadlineChip(p.specs.installDate, "montagem") + toggleBtn(p) + "</span></div>" +
        (open ? '<div class="expand">' + ficha(p, TECH) + '<dl class="ficha"><div class="wide"><dt>Chapa / lote usado</dt><dd>' + specVal(p, "slab") + '</dd></div></dl><div class="job-actions"><button class="btn sm" data-act="cut-undo" data-id="' + esc(p.id) + '">Desfazer corte concluído</button></div>' + issueBlock(p, "Produção") + "</div>" : "");

      var b = blocking(p).length;
      return '<div class="row"><span><span class="t">' + esc(p.specs.clientName || "") + '</span><br><span class="d">' + esc(p.specs.pieceType || "") + " · " + esc(p.specs.stone || "") + '</span></span><span class="job-actions">' + (b ? '<span class="chip warn">' + (b === 1 ? "Falta 1 detalhe" : "Faltam " + b + " detalhes") + "</span>" : '<span class="chip ok">Pronto para produção</span>') + toggleBtn(p) + "</span></div>" +

  // ---------- Montagem ----------
  function dayLabel(iso) {
    var t = todayISO();
    if (iso === t) return "Hoje · " + fmtShort(iso);
    if (iso === addDays(t, 1)) return "Amanhã · " + fmtShort(iso);
    return weekday(iso).replace(".", "") + " · " + fmtShort(iso) + (iso < t ? " · atrasada" : "");
  }
  function renderMontagem() {
    var jobs = projects.filter(function (p) { return p.stage === 4 || (p.stage === 3 && p.specs.installDate); })

    var groups = {}, order = [];
    jobs.forEach(function (p) { var k = p.specs.installDate || "none"; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(p); });
    order.forEach(function (k) {
      h += '<section><div class="day-head">' + (k === "none" ? "Sem data marcada" : esc(dayLabel(k))) + ' <span class="chip">' + groups[k].length + '</span></div><div class="jobs">';
      groups[k].forEach(function (p) {
        var ready = p.stage === 4 ? '<span class="chip ok">Peça pronta</span>' : p.specs.cutDone ? '<span class="chip ok">Peça pronta na fábrica</span>' : '<span class="chip warn">Ainda em produção</span>';
        var addr = p.specs.address || "";
        h += '<article class="job"><div class="job-head"><div><div class="ref mono">' + esc(p.ref) + '</div><div class="name">' + esc(p.specs.clientName || "Sem nome") + "</div></div>" + ready + "</div>";
        h += '<div class="contact">' + (addr ? "<span>" + esc(addr) + ' · <a href="https://www.google.com/maps/search/?api=1&amp;query=' + encodeURIComponent(addr) + '" target="_blank" rel="noopener">Abrir no mapa</a></span>' : '<span class="chip bad">Morada em falta</span>') + (p.specs.phone ? '<span>Telefone: <span class="mono">' + esc(p.specs.phone) + "</span></span>" : "") + "</div>";
        h += ficha(p, ["pieceType", "stone", "area", "edge", "finish", "sinkModel", "sinkMount", "hobCutout", "tapHoles"]);
        if (p.stage === 4) {
          h += '<div class="checks"><label><input type="checkbox" id="mc-done-' + esc(p.id) + '" data-mcheck="installDone" data-id="' + esc(p.id) + '"' + (p.specs.installDone ? " checked" : "") + "> Montagem concluída</label>" +
            '<label><input type="checkbox" id="mc-sign-' + esc(p.id) + '" data-mcheck="clientSignoff" data-id="' + esc(p.id) + '"' + (p.specs.clientSignoff ? " checked" : "") + "> Cliente confirmou que está tudo bem</label></div>";
          if (p.specs.installDone && p.specs.clientSignoff) h += '<span class="chip ok">Concluída. A gestora fecha a obra.</span>';
        }
        h += issueBlock(p, "Montagem") + "</article>";
      });
      h += "</div></section>";
    });
    return h;
  }

  // ---------- Cliente ----------

        return '<div class="field' + (f.full ? " full" : "") + '"><label for="' + id + '">' + esc(f.label) + "</label>" + input + "</div>";

  // ---------- Drawer (one project) ----------
  function fieldHTML(p, f, missingKeys) {
    var v = p.specs[f.key];
    var miss = missingKeys[f.key] ? " missing" : "";
    var who = '<span class="who">' + (f.who === "cliente" ? "cliente" : "equipa") + "</span>";

    if (f.type === "check") {
      return '<div class="field check' + miss + (f.full ? " full" : "") + '"><input type="checkbox" id="' + id + '" data-field="' + f.key + '"' + (v ? " checked" : "") + '><label for="' + id + '">' + esc(f.label) + " " + who + "</label></div>";
    }
    var input;
    if (f.type === "select") {
      input = '<select id="' + id + '" data-field="' + f.key + '"><option value="">Escolher…</option>' + f.options.map(function (o) { return "<option" + (v === o ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("") + "</select>";
    } else {
      input = '<input type="' + f.type + '" id="' + id + '" data-field="' + f.key + '" value="' + esc(v) + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : "") + (f.type === "number" ? ' step="any" min="0"' : "") + ">";
    }
    return '<div class="field' + miss + (f.full ? " full" : "") + '"><label for="' + id + '">' + esc(f.label) + " " + who + "</label>" + input + "</div>";
  }

  function requestMessage(p) {
    var owed = clientOwed(p);
    if (!owed.length) return "";
    var name = (p.specs.clientName || "").split(" ")[0];
    return "Olá" + (name ? " " + name : "") + ",\n\nPara avançarmos com o seu projeto " + p.ref + (p.specs.pieceType ? " (" + p.specs.pieceType.toLowerCase() + ")" : "") + ", precisamos das seguintes informações:\n\n" +
      owed.map(function (f) { return "• " + f.label; }).join("\n") +
      "\n\nPode responder a esta mensagem com os detalhes ou com uma fotografia. Obrigado!";
  }

  function renderDrawer() {
    var root = $("#drawer-root");
    var p = openId && projects.find(function (x) { return x.id === openId; });
    if (!p) { root.innerHTML = ""; return; }
    if (root.contains(document.activeElement) && document.activeElement.matches("input[type=text],input[type=number],input[type=tel],input[type=email],textarea,#note-input") && deferDrawer !== "force") { deferDrawer = true; return; }
    var body = root.querySelector(".d-body");
    var scroll = body ? body.scrollTop : 0;
    var focusId = document.activeElement && root.contains(document.activeElement) ? document.activeElement.id : null;

    var b = blocking(p), ahead = missingAhead(p), owed = clientOwed(p);
    var missingKeys = {}; b.forEach(function (f) { missingKeys[f.key] = true; });
    var h = '<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">';
    h += '<div class="d-head"><div class="grow"><div class="mono" style="color:var(--muted)">' + esc(p.ref) + '</div><h2 id="d-title">' + esc(p.specs.clientName || "Novo projeto") + '</h2><div class="sub">' + esc(p.specs.pieceType || "Tipo de peça por definir") + (p.specs.stone ? " · " + esc(p.specs.stone) : "") + (p.specs.quoteValue ? " · " + euro(p.specs.quoteValue) : "") + '</div></div><button class="btn ghost" data-close aria-label="Fechar">✕</button></div>';
    h += '<div class="d-body">';
    h += '<div class="stepper">' + STAGES.map(function (s, i) { return '<div class="step ' + (i < p.stage ? "done" : i === p.stage ? "now" : "") + '"><i></i><span>' + s + "</span></div>"; }).join("") + "</div>";

    // Gate
    if (p.stage < 5) {
      var next = STAGES[p.stage + 1];
      h += '<div class="panel gate ' + (b.length ? "blocked" : "ready") + '"><h3>' + (b.length ? "Para passar a " + next + " falta:" : "Tudo pronto para passar a " + next) + "</h3>";
      if (b.length) h += '<div class="chips">' + b.map(function (f) { return '<span class="chip bad">' + esc(f.label) + " · " + f.who + "</span>"; }).join("") + "</div>";

      h += '<div class="gate-actions"><button class="btn primary" id="btn-advance"' + (b.length ? " disabled" : "") + ">Avançar para " + next + " →</button>" + (p.stage > 0 ? '<button class="btn ghost sm" id="btn-back">← Voltar a ' + STAGES[p.stage - 1] + "</button>" : "") + "</div></div>";
    } else {
      h += '<div class="panel gate ready"><h3>Obra concluída</h3><div class="gate-actions"><button class="btn ghost sm" id="btn-back">← Reabrir em Montagem</button></div></div>';
    }

    if (p.issue) {
      h += '<div class="panel gate blocked"><h3>Problema reportado pela ' + esc(p.issue.from) + ' <span class="chip">' + fmtDate(p.issue.at) + '</span></h3><div class="issue">' + esc(p.issue.text) + '</div><div class="gate-actions"><button class="btn" id="btn-resolve">Marcar como resolvido</button></div></div>';
    }

    // Client request
    if (owed.length && p.stage < 5) {
      var w = waitDays(p);
      h += '<div class="panel"><h3>Pedir ao cliente ' + (w !== null ? '<span class="chip warn">' + (w === 0 ? "Pedido hoje" : "Pedido há " + w + (w === 1 ? " dia" : " dias")) + "</span>" : '<span class="chip">' + owed.length + " em falta</span>") + "</h3>";
      h += '<textarea class="msg" id="req-msg" aria-label="Mensagem para o cliente" readonly>' + esc(requestMessage(p)) + "</textarea>";

    } else if (p.waitingSince) {

    for (var s = 0; s < 5; s++) {

    h += "</div></aside>";

    if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus({ preventScroll: true });
    deferDrawer = false;
  }

  function current() { return projects.find(function (x) { return x.id === openId; }); }

  function openProject(id) { openId = id; confirmDelete = false; deferDrawer = "force"; renderDrawer(); var c = $("#drawer-root .d-head .btn"); if (c) c.focus(); }
  function closeDrawer() { openId = null; confirmDelete = false; $("#drawer-root").innerHTML = ""; }

  function createProject() {
    var p = { id: newId(), ref: nextRef(), stage: 0, specs: { clientType: "Cliente final" }, dueDate: "", waitingSince: null, createdAt: nowISO(), stageSince: nowISO(), history: [] };
    log(p, "Projeto criado");
    saveProject(p);
    openProject(p.id);
    var n = document.getElementById("fld-clientName"); if (n) n.focus();
  }

  function byId(id) { var p = projects.find(function (x) { return x.id === id; }); return p ? clone(p) : null; }
  function workerAction(t) {
    var act = t.dataset.act;
    if (act === "report") { reportOpen = t.dataset.id; deferMain = "force"; render(); var ta = document.getElementById("rep-" + reportOpen); if (ta) ta.focus(); return; }
    if (act === "toggle") { expanded[t.dataset.id] = !expanded[t.dataset.id]; deferMain = "force"; render(); return; }
    if (act === "report-cancel") { delete drafts["rep-" + reportOpen]; reportOpen = null; deferMain = "force"; render(); return; }
    var p = byId(t.dataset.id); if (!p) return;
    if (act === "report-send") {
      var ta2 = document.getElementById("rep-" + p.id), txt = ta2 ? ta2.value.trim() : "";
      if (!txt) { toast("Escreva primeiro o que se passa."); return; }
      p.issue = { text: txt, from: t.dataset.from, at: nowISO() }; log(p, t.dataset.from + " reportou: " + txt);
      delete drafts["rep-" + p.id]; reportOpen = null; deferMain = "force"; saveProject(p); toast("Enviado à gestora"); return;
    }
    if (act === "cut-done") { expanded[p.id] = true; p.specs.cutDone = true; log(p, "Produção: corte e acabamento concluídos (" + (p.specs.slab || "") + ")"); deferMain = "force"; saveProject(p); toast("Marcado como concluído"); return; }
    if (act === "cut-undo") { p.specs.cutDone = false; log(p, "Produção: corte reaberto"); deferMain = "force"; saveProject(p); return; }
  }
  document.addEventListener("submit", function (e) {
    if (e.target.id !== "cli-form") return;
    e.preventDefault();
    var p = byId(clientPick); if (!p) return;
    var sent = [];
    e.target.querySelectorAll("[data-cfield]").forEach(function (el) {
      var f = FIELD[el.dataset.cfield];
      var v = f.type === "check" ? el.checked : el.value.trim();
      if (!blank(v)) { p.specs[f.key] = v; sent.push(f.label.toLowerCase()); }
      delete drafts[el.id];
    });
    if (!sent.length) { toast("Preencha pelo menos um campo."); return; }
    log(p, "Cliente enviou pela página: " + sent.join(", "));
    if (!clientOwed(p).length) p.waitingSince = null;
    deferMain = "force"; saveProject(p); toast("Obrigado! Recebemos as suas informações.");
  });

  // ---------- Importar pedido: AI reads an email / PDF / photo into a draft project ----------
  var sampleFn = null, imagesOK = false, imp = null, demoImport = null;
  var NO_IMPORT = { slab: 1, cutDone: 1, installDone: 1, clientSignoff: 1 };
  var IMPORT_FIELDS = FIELDS.filter(function (f) { return !NO_IMPORT[f.key]; });
  var PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";

  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);

  document.addEventListener("dragleave", function (e) { var z = e.target.closest && e.target.closest("#imp-drop"); if (z) z.classList.remove("over"); });
  document.addEventListener("drop", function (e) { var z = e.target.closest && e.target.closest("#imp-drop"); if (z && imp) { e.preventDefault(); addImportFiles(e.dataTransfer.files); } });

  // ---------- Boot ----------
  render();
  var started = false;
  function startLocal() {
    if (started) return; started = true; localMode = true; projects = localLoad();
    // A standalone demo build sets window.FLUXO_DEMO to sample projects for a first visit.
    if (!projects.length && typeof window.FLUXO_DEMO === "function") { projects = window.FLUXO_DEMO(); localSave(); }
    render();
  }
  try {
    if (!window.claude || typeof window.claude.use !== "function") { startLocal(); }
    else {
      window.claude.use("db").then(function (db) {
        if (!db) { startLocal(); return; }
        started = true; store = db;
        db.collection("projects").onSnapshot(function (snap) {
          projects = snap.docs.map(function (d) { var o = clone(d.data()); o.id = d.id; o.specs = o.specs || {}; return o; });
          render();
        }, function () { toast("Ligação aos dados perdida. Recarregue a página."); });
      }, startLocal);
    }
  } catch (e) { startLocal(); }
  // The import button appears only where this page can ask Claude to read an order.
  try {
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("sample").then(function (fn) {
        if (!fn) return;
        sampleFn = fn;
        (fn.limits ? fn.limits() : Promise.reject()).then(function (l) { imagesOK = !!(l && l.images); }, function () {}).then(function () { renderHead(); });
      }, function () {});
    }
  } catch (e) {}
  // The standalone demo has no Claude: it sets window.FLUXO_DEMO_IMPORT to a simulated reader.
  if (!sampleFn && window.FLUXO_DEMO_IMPORT && !(window.claude && window.claude.use)) {
    demoImport = window.FLUXO_DEMO_IMPORT;
    sampleFn = { json: demoImport.json };
    renderHead();
  }
})();
</script>
